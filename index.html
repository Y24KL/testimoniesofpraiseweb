<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Testimonies of Praise</title>
  <link rel="icon" type="image/png" href="images/Testimonies of Praise.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ALL STYLES INCLUDED TO ENSURE IT LOADS */
    :root {
      --primary: #4B006E;
      --accent: #f5c518;
      --dark: #000000;
      --glass: rgba(75, 0, 110, 0.85);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--dark); color: #fff; overflow-x: hidden; }

    /* LOADER */
    #loader {
      position: fixed; inset: 0; background: var(--dark);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.8s;
    }
    .loader-finish { opacity: 0; pointer-events: none; }

    /* NAV */
    .main-nav {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 5%; background: var(--glass); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(245, 197, 24, 0.2);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { height: 40px; }
    .logo h1 { font-size: 1rem; color: var(--accent); letter-spacing: 1px; }
    .main-nav ul { display: flex; list-style: none; gap: 20px; }
    .main-nav a { text-decoration: none; color: #fff; font-size: 0.8rem; font-weight: 600; }

    /* HERO */
    .hero {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; position: relative;
    }
    .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 0; }
    .hero-content { position: relative; z-index: 1; padding: 0 10%; }
    .hero-content h1 { font-size: 3rem; margin-bottom: 1rem; }
    .gradient-text { color: var(--accent); }

    /* BUTTONS */
    .btn {
      padding: 12px 30px; border-radius: 50px; text-decoration: none;
      font-weight: 700; display: inline-block; background: var(--accent); color: var(--primary);
      transition: 0.3s; margin-top: 1rem;
    }
    .btn:hover { background: #fff; transform: scale(1.05); }

    /* VIDEO SECTION */
    .videos-section { padding: 5rem 5%; text-align: center; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; margin-top: 2rem;
    }
    .video-card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
    .video-card video { width: 100%; display: block; }
    
    /* FORM */
    .testimony-section { padding: 5rem 5%; background: #0a0a0a; }
    .form-container { max-width: 500px; margin: 0 auto; background: #111; padding: 2rem; border-radius: 15px; }
    input, textarea { 
      width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; 
      border: 1px solid #333; background: #000; color: #fff; 
    }

    /* REVEAL ANIMATION */
    .reveal { opacity: 0; transform: translateY(30px); transition: 1s all ease; }
    .reveal.active { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="loader">
    <img src="images/Testimonies of Praise.png" width="80" alt="Loading">
    <p style="color: var(--accent); margin-top: 15px; letter-spacing: 2px;">LOADING...</p>
  </div>

  <nav class="main-nav">
    <div class="logo">
      <img src="images/Testimonies of Praise.png" alt="Logo" />
      <h1>TESTIMONIES OF PRAISE</h1>
    </div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="live.html">WATCH LIVE</a></li>
    </ul>
  </nav>

  <header class="hero">
    <video autoplay muted loop playsinline class="hero-video">
      <source src="videos/LOVEWORLD WORSHIP APP PROMO.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content reveal active">
      <h1>Testimonies of<br><span class="gradient-text">Praise</span></h1>
      <p>Experience high-definition storytelling and unfiltered testimonies.</p>
      <a href="live.html" class="btn">Watch Live Now</a>
    </div>
  </header>

  <section class="videos-section reveal active">
    <h2>TESTIFIERS & RECAPS</h2>
    <div class="video-grid" id="videoGrid">
      <p>Loading testimonies...</p>
    </div>
  </section>

  <section class="testimony-section">
    <div class="form-container">
      <h2 style="color: var(--accent); text-align: center; margin-bottom: 1.5rem;">SUBMIT TESTIMONY</h2>
      <form action="https://formspree.io/f/meepnpbb" method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <textarea name="message" rows="4" placeholder="Your Testimony" required></textarea>
        <button type="submit" class="btn" style="width:100%; border:none; cursor:pointer;">Submit</button>
      </form>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
