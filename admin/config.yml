backend:
  name: github
  repo: Y24KL/testimoniesofpraiseweb
  branch: main
  base_url: https://testimoniesofpraise-oauth.onrender.com
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

logo_url: "/images/Testimonies of Praise.png"
# site_url: "https://your-deployed-domain.example"  # uncomment and set to your live domain to enable the "View Site" link

collections:
  - name: "videos"
    label: "Testimony Videos"
    label_singular: "Video"
    description: "The testimony & recap videos shown in the homepage carousel."
    files:
      - name: "videos"
        label: "Testimony Videos"
        file: "data/videos.json"
        format: json
        fields:
          - label: "Videos"
            name: "videos"
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Title", name: "title", widget: string}
              - {label: "Video URL", name: "url", widget: string, hint: "Direct link to the .mp4 file (e.g. a Cloudinary URL)"}
              - {label: "Poster Image", name: "poster", widget: image, required: false}

  - name: "live"
    label: "Live Stream"
    label_singular: "Live Stream Settings"
    description: "Controls for the Watch Live page."
    files:
      - name: "stream"
        label: "Live Stream Settings"
        file: "data/stream.json"
        format: json
        fields:
          - {label: "Currently Live", name: "status", widget: boolean, default: false, hint: "Turn this on right before you go live, and off when the service ends. This is what actually controls whether visitors see the stream or the offline screen — nothing plays until this is switched on."}
          - {label: "YouTube Video/Live Link", name: "youtubeVideoId", widget: string, required: false, hint: "Paste the full YouTube link (watch, youtu.be, or /live/ links all work) or just the 11-character video ID. When set, this is what visitors see, and it counts toward your channel's views. Leave blank to fall back to the CDN stream below."}
          - {label: "Stream URL (.m3u8, fallback)", name: "streamUrl", widget: string, hint: "Only used when no YouTube Video ID is set above."}
          - {label: "Poster Image", name: "poster", widget: image, required: false}
          - {label: "Offline Background Video URL", name: "offlineVideoUrl", widget: string, required: false, hint: "A video (e.g. a Cloudinary .mp4 link) that plays quietly in the background of the player while you're offline. Leave blank for a plain dark background."}
          - {label: "Live Info Heading", name: "heading", widget: string, default: "Testimonies of Praise Live"}
          - {label: "Live Info Description", name: "description", widget: text}

  - name: "settings"
    label: "Site Settings"
    label_singular: "Setting"
    description: "Homepage hero content and social links."
    files:
      - name: "settings"
        label: "Site Settings"
        file: "data/settings.json"
        format: json
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: string, default: "Testimonies of Praise"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: text}
          - {label: "Hero Video URL", name: "heroVideo", widget: string}
          - label: "Social Links"
            name: "socials"
            widget: object
            fields:
              - {label: "Kingschat", name: "kingschat", widget: string, required: false}
              - {label: "X (Twitter)", name: "x", widget: string, required: false}

  - name: "adotopoc"
    label: "ADOTOPOC 2026 Resources"
    label_singular: "Resource"
    description: "Media assets, videos, graphics, and e-cards for A Day of Testimonies of Praise Outreaches and Crusades (5 September 2026)."
    files:
      - name: "resources"
        label: "Crusade Media Resources"
        file: "data/adotopoc.json"
        format: json
        fields:
          - label: "Resources"
            name: "resources"
            widget: list
            summary: "{{title}} ({{category}})"
            fields:
              - {label: "Resource Title", name: "title", widget: string}
              - {label: "Description", name: "description", widget: text}
              - {label: "Category", name: "category", widget: select, options: ["video", "graphic", "ecard", "photo", "other"]}
              - {label: "Event Name", name: "event_name", widget: string, default: "ADOTOPOC 2026"}
              - {label: "Event Date", name: "event_date", widget: date, default: "2026-09-05", format: "YYYY-MM-DD"}
              - {label: "Thumbnail / Preview Image", name: "thumbnail_url", widget: string, hint: "Image link (Cloudinary URL or /images/...)"}
              - {label: "File / Media URL", name: "file_url", widget: string, hint: "Direct link to .mp4, high-res graphic, or PDF file"}
              - {label: "File Type", name: "file_type", widget: string, default: "MP4"}
              - {label: "File Size (bytes)", name: "file_size_bytes", widget: number, required: false}
              - {label: "Tags", name: "tags", widget: list, required: false}
              - {label: "Status", name: "status", widget: select, options: ["published", "draft"], default: "published"}

