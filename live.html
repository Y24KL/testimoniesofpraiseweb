<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WATCH LIVE | Testimonies of Praise</title>
  <link rel="icon" type="image/png" href="images/Testimonies of Praise.png">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4B006E;
      --accent: #f5c518;
      --dark: #000000;
    }

    body {
      background: var(--dark);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }

    /* ===== PRELOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--dark);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s, visibility 0.8s;
    }
    .loader-finish { opacity: 0; visibility: hidden; }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(75, 0, 110, 0.9);
      backdrop-filter: blur(15px);
      padding: 1rem 5%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(245, 197, 24, 0.2);
    }

    header h1 {
      color: var(--accent);
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin: 0;
    }

    .viewer-count {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff4444;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ff4444;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    .main-content {
      margin-top: 100px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .video-wrapper {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(75, 0, 110, 0.5);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .live-info {
      margin-top: 2rem;
      text-align: center;
      max-width: 700px;
    }

    .live-info h2 {
      color: var(--accent);
      margin-bottom: 10px;
    }

    .back-btn {
      margin-top: 2rem;
      padding: 12px 30px;
      background: var(--accent);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="loader">
    <img src="images/Testimonies of Praise.png" width="100" alt="Loading...">
    <p style="margin-top: 20px; color: var(--accent); letter-spacing: 2px;">LOADING STREAM...</p>
  </div>

  <header>
    <h1>WATCH LIVE</h1>
    <div class="viewer-count">
      <div class="dot"></div>
      <span id="count"></span>LIVE
    </div>
  </header>

  <div class="main-content">
    <div class="video-wrapper">
      <video id="livePlayer" controls autoplay playsinline poster="images/live-poster.jpg"></video>
    </div>

    <div class="live-info">
      <h2>Testimonies of Praise Live</h2>
      <p>Join thousands across the globe as we celebrate the triumphs of faith. Your miracle is next!</p>
      <a href="index.html" class="back-btn">Return Home</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. FIXED FIREBASE CONFIG (Removed extra quote)
    const firebaseConfig = {
      apiKey: "AIzaSyDKJSuZJ8ZqGE6rUZUjlPyMHiH4TgCdY6o", 
      authDomain: "topweb-698e5.firebaseapp.com",
      databaseURL: "https://topweb-698e5-default-rtdb.firebaseio.com/",
      projectId: "topweb-698e5",
      storageBucket: "topweb-698e5.firebasestorage.app",
      messagingSenderId: "675291297804",
      appId: "1:675291297804:web:6b2ae484e87be20bb4d629"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 2. LIVE VIEWER TRACKING
    const viewerRef = ref(db, 'liveViewers');
    const myViewerRef = push(viewerRef);

    set(myViewerRef, { joinedAt: serverTimestamp() });
    onDisconnect(myViewerRef).remove();

    onValue(viewerRef, (snapshot) => {
      // Changed size logic to handle object keys
      const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
      const countElement = document.getElementById('count');
      if (countElement) countElement.innerText = count;
    });

    // 3. HLS PLAYER LOGIC
    const video = document.getElementById('livePlayer');
    const streamUrl = 'https://vcpout-lw-wdc-01-sp.ceflixcdn.com/lxp/play1/playlist.m3u8'; 

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
    }

    // 4. PRELOADER HIDE (Added a fallback to ensure it always hides)
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('loader-finish');
    }

    window.addEventListener('load', hideLoader);
    // Fallback: If page takes too long, hide loader anyway after 4 seconds
    setTimeout(hideLoader, 4000); 
  </script>

</body>
</html>
