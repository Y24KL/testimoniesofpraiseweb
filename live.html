<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WATCH LIVE | Testimonies of Praise</title>
  <link rel="icon" type="image/png" href="images/Testimonies of Praise.png">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4B006E;
      --accent: #f5c518;
      --dark: #000000;
    }

    body {
      background: var(--dark);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }

    /* ===== PRELOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--dark);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s, visibility 0.8s;
    }
    .loader-finish { opacity: 0; visibility: hidden; }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(75, 0, 110, 0.9);
      backdrop-filter: blur(15px);
      padding: 1rem 5%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(245, 197, 24, 0.2);
    }

    header h1 {
      color: var(--accent);
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin: 0;
    }

    /* ===== DYNAMIC LIVE STATUS ===== */
    .status-indicator {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff4444;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ff4444;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    .main-content {
      margin-top: 100px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .video-wrapper {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(75, 0, 110, 0.5);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .live-info {
      margin-top: 2rem;
      text-align: center;
      max-width: 700px;
    }

    .live-info h2 {
      color: var(--accent);
      margin-bottom: 10px;
    }

    .offline-card {
      margin-top: 1.5rem;
      padding: 18px 30px;
      border: 1px solid rgba(245, 197, 24, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .offline-card p { color: var(--accent); font-weight: 700; letter-spacing: 1px; margin: 0; }
    .offline-card span { color: #999; font-size: 0.85rem; }

    .back-btn {
      margin-top: 2rem;
      padding: 12px 30px;
      background: var(--accent);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .video-wrapper { border-radius: 0; border: none; }
      .main-content { padding: 1rem; margin-top: 80px; }
    }
  </style>
</head>
<body>

  <div id="loader">
    <img src="images/Testimonies of Praise.png" width="100" alt="Loading...">
    <p style="margin-top: 20px; color: var(--accent); letter-spacing: 2px;">CONNECTING TO STREAM...</p>
  </div>

  <header>
    <h1>WATCH LIVE</h1>
    <div id="liveStatus" class="status-indicator" style="display: none;">
      <div class="dot"></div>
      LIVE
    </div>
  </header>

  <div class="main-content">
    <div class="video-wrapper">
      <video id="livePlayer" controls autoplay playsinline poster="images/live-poster.jpg"></video>
    </div>

    <div id="offlineState" class="offline-card">
      <p>We're not live right now</p>
      <span>Check back soon — testimonies are on the way!</span>
    </div>

    <div class="live-info">
      <h2 id="infoHeading">Testimonies of Praise Live</h2>
      <p id="infoDescription">Join thousands across the globe as we celebrate the triumphs of faith. Your miracle is next!</p>
      <a href="index.html" class="back-btn">Return Home</a>
    </div>
  </div>

  <script>
    const DEFAULT_STREAM = {
      streamUrl: 'https://vcpout-lw-wdc-01-sp.ceflixcdn.com/lxp/play1/playlist.m3u8',
      poster: 'images/live-poster.jpg',
      heading: 'Testimonies of Praise Live',
      description: "Join thousands across the globe as we celebrate the triumphs of faith. Your miracle is next!"
    };

    const video = document.getElementById('livePlayer');
    const liveStatus = document.getElementById('liveStatus');
    const offlineState = document.getElementById('offlineState');
    const infoHeading = document.getElementById('infoHeading');
    const infoDescription = document.getElementById('infoDescription');

    function showLive() {
      liveStatus.style.display = 'flex';
      offlineState.style.display = 'none';
    }

    function showOffline() {
      liveStatus.style.display = 'none';
      offlineState.style.display = 'flex';
    }

    // --- HLS (.m3u8) PLAYER LOGIC ---
    function startPlayer(streamUrl) {
      if (typeof Hls === 'undefined') {
        console.warn('hls.js failed to load.');
        showOffline();
        return;
      }
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        // Show the LIVE badge only when the manifest is successfully loaded
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          showLive();
          video.play().catch(e => console.log("Autoplay blocked, waiting for user interaction."));
        });

        // Show the offline state if there is a fatal error (stream is offline)
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) showOffline();
        });
      }
      // --- NATIVE SUPPORT (Safari/iOS) ---
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('playing', showLive);
        video.addEventListener('error', showOffline);
      } else {
        showOffline();
      }
    }

    // --- Load stream settings from the CMS (data/stream.json) ---
    (async function init() {
      let config = DEFAULT_STREAM;
      try {
        const res = await fetch('data/stream.json');
        if (res.ok) config = { ...DEFAULT_STREAM, ...(await res.json()) };
      } catch (err) {
        console.warn('Using default stream settings:', err);
      }

      if (config.poster) video.setAttribute('poster', config.poster);
      if (infoHeading && config.heading) infoHeading.textContent = config.heading;
      if (infoDescription && config.description) infoDescription.textContent = config.description;

      startPlayer(config.streamUrl);

      // If nothing has confirmed a live stream after a while, show the offline state
      setTimeout(() => {
        if (liveStatus.style.display !== 'flex') showOffline();
      }, 8000);
    })();

    // --- PRELOADER HIDE LOGIC ---
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('loader-finish');
    }

    // Hide loader when page is ready, or after 4 seconds maximum
    window.addEventListener('load', () => setTimeout(hideLoader, 1000));
    setTimeout(hideLoader, 4000);
  </script>

</body>
</html>
